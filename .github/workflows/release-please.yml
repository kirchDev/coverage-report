# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing (OIDC) and the provenance attestation. No NPM_TOKEN
  # exists in this repo; npm verifies this workflow against the trusted
  # publisher configured on the package.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Run release-please
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Fetch Release App PEM from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            3a3459f0-c986-4ff3-a36b-b4550012d41e > KIRCHDEV_RELEASE_APP_PEM

      - name: Mint Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 'Iv23li3hNqtsZ8fDlwqH'
          private-key: ${{ env.KIRCHDEV_RELEASE_APP_PEM }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: Publish stable release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The npm artifact is lib/, built by build:npm — not the action bundle in
      # dist/ that `pnpm build` writes and check:dist gates. prepack rebuilds it
      # on publish anyway; this makes a build failure fail before the publish.
      - name: Build
        run: pnpm build:npm

      - name: Publish
        run: pnpm publish --access public --provenance --no-git-checks --tag latest

  publish-prerelease:
    name: Publish prerelease
    # Skip the version-bump merges release-please pushes onto main.
    if: >-
      ${{
        github.ref_name == 'dev'
        || (
          github.ref_name == 'main'
          && !startsWith(github.event.head_commit.message, 'chore(main): release')
          && !startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:npm

      # THE BASE IS THE LAST PUBLISHED RELEASE, NOT THIS BRANCH'S package.json.
      # release-please writes its version bump onto main and onto main alone, so
      # a dev branch keeps whatever version it carried when it last forked, long
      # after the release shipped. Reading package.json off the branch therefore
      # published a version semver ranks BELOW the latest release, and `@dev`
      # resolved to something older than `@latest`. Deriving the base from the
      # release instead makes the prerelease version independent of whether main
      # was ever merged back down.
      - name: Compute prerelease version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG=dev-main
          else
            TAG=dev
          fi

          # No release yet -- a repo fresh out of the template, whose 0.0.0
          # manifest entry means "never released" -- leaves this empty, so fall
          # back to the branch's own version. `|| true` because `gh release
          # view` exits non-zero on an empty release list under `set -e`.
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)
          LATEST=${LATEST#v}
          if [ -z "$LATEST" ]; then
            LATEST=$(node -p "require('./package.json').version")
          fi

          # Patch-bump the base so the prerelease sorts ABOVE the release it
          # follows: dev carries commits made after that release, and
          # 0.2.0-dev.N would rank below 0.2.0 while 0.2.1-dev.N ranks above it.
          BASE=$(node -e 'const [a,b,c]=process.argv[1].split("-")[0].split(".").map(Number);console.log(`${a}.${b}.${c+1}`)' "$LATEST")

          SHORT_SHA=${GITHUB_SHA::7}
          NEW_VERSION="${BASE}-${TAG}.${{ github.run_number }}-${SHORT_SHA}"
          npm version --no-git-tag-version --allow-same-version "$NEW_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: pnpm publish --access public --provenance --no-git-checks --tag ${{ steps.version.outputs.tag }}
