# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Caller stub. release-please and the npm publish both live in
# kirchDev/workflows; this file carries the triggers and composes the two.
name: Release Please

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # `dev` reaches this workflow for the prerelease job below; release-please
    # itself only ever runs on the release branch.
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
    with:
      # This repo is consumed as `kirchDev/coverage-report@<ref>`, so `@v0` has
      # to keep meaning "the newest v0.x.y".
      major-alias: true
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  publish-release:
    name: Publish stable release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and the provenance attestation. No
      # NPM_TOKEN exists in this repo; npm verifies this workflow against the
      # trusted publisher configured on the package.
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}
      # The npm artifact is lib/, built by build:npm — not the action bundle in
      # dist/ that `pnpm build` writes and check:dist gates.
      build-script: build:npm

  publish-prerelease:
    name: Publish prerelease
    # Skip the version-bump merges release-please pushes onto main.
    if: >-
      ${{
        github.ref_name == 'dev'
        || (
          github.ref_name == 'main'
          && !startsWith(github.event.head_commit.message, 'chore(main): release')
          && !startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
    with:
      prerelease: true
      build-script: build:npm
